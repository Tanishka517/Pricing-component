<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Pricing Component</title>
 
<body>
 
 <header>
  <h4>Our Pricing</h4>
  <div class="toggle-container">
    <span>Monthly</span>

    <label class="switch">
        <input type="checkbox" id="billingToggle">
        <span class="slider"></span>
    </label>

    <span>Yearly</span>
</div>
 </header>
  <section>
  <div class="basic">
<h4>Basic</h4>
<h2 class="basic-price">$19.99</h2>
<hr>
<p>500 GB Storage</p>
<hr>
<p>500 GB Storage</p>
<hr>
<p>Send up to 3GB</p>
<hr>
<button>Learn More</button>
</div>
<div class="professional">
<h4>Professional</h4>
<h2 class="pro-price">$29.99</h2>
<hr>
<p>1 TB Storage</p>
<hr>
<p>5 Users Allowed</p>
<hr>
<p>Send up to 5GB</p>
<hr>
<button>Learn More</button>
</div>
<div class="master">
<h4>Master</h4>
<h2 class="master-price">$39.99</h2>
<hr>
<p>2 TB Storage</p>
<hr>
<p>10 Users Allowed</p>
<hr>
<p>Send up to 20 GB</p>
<hr>
<button>Learn More</button>
</div>
</section>
 <script src="script.js"></script>
</head>
</body>
</html>
